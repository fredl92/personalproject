[project]
name = "personal-toolkit"
version = "1.0.0"
description = "Self-hosted open-source toolkit: yt-dlp, Ollama, Whisper, n8n, Penpot, Plausible, Fooocus"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "yt-dlp",
  "faster-whisper",
]

[project.urls]
Homepage = "https://github.com/fredl92/personalproject"
Repository = "https://github.com/fredl92/personalproject"

[tool.personal-toolkit]
services = ["n8n", "penpot", "plausible", "ollama", "fooocus"]
cli_tools = ["yt-dlp", "whisper", "ollama"]
