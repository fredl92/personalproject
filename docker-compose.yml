name: personal-toolkit

networks:
  dashboard:
  automation:
  design:

volumes:
  n8n_data:
  automation_models:
  penpot_postgres:
  penpot_assets:

services:
  dashboard:
    profiles: [dashboard]
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${DASHBOARD_PORT:-8080}:80"]
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [dashboard]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1/config.js >/dev/null && wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6

  n8n:
    profiles: [automation]
    image: n8nio/n8n:${N8N_VERSION:-2.37.7}
    restart: unless-stopped
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run pt init}
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_TIMEOUT_MAX: 14400
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-Europe/Brussels}
      TZ: ${TZ:-Europe/Brussels}
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on:
      pipeline-worker:
        condition: service_healthy
    networks: [automation]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  pipeline-worker:
    profiles: [automation]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    init: true
    user: "${TOOLKIT_UID:-1000}:${TOOLKIT_GID:-1000}"
    environment:
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Run pt init}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    # Only this worker writes job files. n8n reads results through authenticated HTTP.
    volumes:
      - ${JOBS_DIR:-./data/jobs}:/data/jobs
      - ${WHISPER_CACHE_DIR:-./data/whisper-cache}:/cache
    depends_on:
      ollama:
        condition: service_healthy
    networks: [automation]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    profiles: [automation]
    image: ollama/ollama:${OLLAMA_VERSION:-0.33.2}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes: ["automation_models:/root/.ollama"]
    networks: [automation]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12

  penpot-postgres:
    profiles: [design]
    image: postgres:15.15-bookworm
    restart: unless-stopped
    stop_signal: SIGINT
    volumes: ["penpot_postgres:/var/lib/postgresql/data"]
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Run pt init}
    networks: [design]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U penpot -d penpot"]
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-valkey:
    profiles: [design]
    image: valkey/valkey:8.1.5
    restart: unless-stopped
    networks: [design]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  penpot-backend:
    profiles: [design]
    image: penpotapp/backend:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    volumes: ["penpot_assets:/opt/data/assets"]
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_FLAGS: disable-email-verification disable-secure-session-cookies
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run pt init}
      PENPOT_PUBLIC_URI: http://localhost:${PENPOT_PORT:-9001}
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD:?Run pt init}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
    networks: [design]

  penpot-exporter:
    profiles: [design]
    image: penpotapp/exporter:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?Run pt init}
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    networks: [design]

  penpot-frontend:
    profiles: [design]
    image: penpotapp/frontend:${PENPOT_VERSION:-2.17.2}
    restart: unless-stopped
    ports: ["127.0.0.1:${PENPOT_PORT:-9001}:8080"]
    volumes: ["penpot_assets:/opt/data/assets"]
    depends_on: [penpot-backend, penpot-exporter]
    environment:
      PENPOT_FLAGS: disable-email-verification disable-secure-session-cookies
      PENPOT_PUBLIC_URI: http://localhost:${PENPOT_PORT:-9001}
      PENPOT_BACKEND_URI: http://penpot-backend:6060
      PENPOT_EXPORTER_URI: http://penpot-exporter:6061
    networks: [design]
